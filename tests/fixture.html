<!doctype html>
<html lang="zh-CN" data-zble-reset-fixture>
<meta charset="utf-8">
<title>Booklist enhancer local fixture</title>
<style>
  body { margin: 20px; font: 14px system-ui; }
  .readlist-view { display: flex; flex-wrap: wrap; gap: 12px; max-width: 900px; }
  z-bookcard { box-sizing: border-box; display: block; flex: 0 0 calc((100% - 36px)/4); min-height: 320px; border: 1px solid #bbb; padding: 8px; }
  .page-load-more { margin: 20px; }
  @media (max-width: 600px) { z-bookcard { flex-basis: calc((100% - 12px)/2); } }
</style>
<div class="booklist-header__tabs"><tab>Books (774)</tab></div>
<div class="booklist-main active"><div class="readlist-view"></div><div class="page-load-more" role="button" tabindex="0" onclick="loadMoreBooks(this)"><span class="content">Show more</span></div></div>
<button id="fixture-complete">Simulate positive download map</button>
<button id="fixture-empty">Simulate ambiguous empty map</button>
<button id="fixture-add-seven">Add seven cards</button>
<button id="fixture-replace-seven">Replace with seven cards</button>
<button id="fixture-stall-next">Stall the next Show more click</button>
<button id="fixture-css-lock">Apply CSS-only lock to Show more</button>
<script>
  history.replaceState(null, '', '/booklist/fixture');
  window.GM_getValue = (key, fallback) => {
    const raw = sessionStorage.getItem(`gm:${key}`);
    return raw === null ? fallback : JSON.parse(raw);
  };
  window.GM_setValue = (key, value) => sessionStorage.setItem(`gm:${key}`, JSON.stringify(value));
  window.__fixtureOpened = 0;
  window.GM_openInTab = () => { window.__fixtureOpened++; return {}; }; // Mock only: never opens a tab.
  window.unsafeWindow = window;
  window.ZLibrary = {
    _: { downloaded: { byId: {}, byIsbn: {} } },
    checkIsDownloaded(id, ...isbns) {
      const map = this._.downloaded;
      return Object.hasOwn(map.byId, id) || isbns.some(isbn => Object.hasOwn(map.byIsbn, isbn));
    },
  };
  customElements.define('z-bookcard', class extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      const cover = document.createElement('z-cover');
      cover.setAttribute('id', this.dataset.bookId);
      cover.setAttribute('isbn', this.dataset.isbn || '');
      const meta = document.createElement('div');
      meta.className = 'meta desktop';
      meta.innerHTML = `<span class="idle">Chinese${this.getAttribute('year') === '0' ? '' : ', ' + this.getAttribute('year')}</span><span class="hover">PDF, 1 MB</span>`;
      const mobile = document.createElement('div');
      mobile.className = 'meta mobile';
      mobile.innerHTML = `<span class="idle">ch${this.getAttribute('year') === '0' ? '' : ', ' + this.getAttribute('year')}</span>`;
      const info = document.createElement('div');
      info.className = 'book-info';
      info.innerHTML = '<div class="title"><slot name="title"></slot></div><div class="author"><a href="/author/123">A very long original author name that keeps going across several lines for layout verification</a></div>';
      const nativeStyle = document.createElement('style');
      nativeStyle.textContent = '.book-info{height:88px;overflow:hidden}.book-info .title{max-height:40px;overflow:hidden;line-height:20px}.book-info .author{max-height:20px;overflow:hidden;line-height:20px}.meta{margin-top:7px}.mobile{display:none}@media(max-width:600px){.desktop{display:none}.mobile{display:block}}';
      root.append(nativeStyle, cover, info, meta, mobile);
    }
  });
  const list = document.querySelector('.readlist-view');
  let next = 1;
  function addCards(n) {
    for (let i = 0; i < n; i++) {
      const card = document.createElement('z-bookcard');
      card.setAttribute('extension', next % 2 ? 'pdf' : 'epub');
      card.setAttribute('href', `/book/${next}`);
      card.setAttribute('language', 'chinese');
      card.setAttribute('year', next % 7 ? '2024' : '0');
      card.dataset.bookId = String(next);
      card.dataset.isbn = `isbn-${next}`;
      const title = document.createElement('span');
      title.slot = 'title';
      title.textContent = next === 1 ? 'A very long original book title that continues across many lines to exercise the expanded-title layout without changing the card width or neighboring links. '.repeat(5) : `Book ${next}`;
      card.append(title);
      list.append(card);
      next++;
    }
  }
  addCards(20);
  let stallNext = false;
  window.loadMoreBooks = button => {
    if (stallNext) {
      stallNext = false;
      button.setAttribute('aria-disabled', 'true');
      return;
    }
    if (button.getAttribute('aria-disabled') === 'true' || button.style.pointerEvents === 'none') return;
    addCards(20);
  };
  document.querySelector('#fixture-stall-next').addEventListener('click', () => { stallNext = true; });
  document.querySelector('#fixture-css-lock').addEventListener('click', () => {
    document.querySelector('.page-load-more').style.pointerEvents = 'none';
  });
  document.querySelector('#fixture-add-seven').addEventListener('click', () => addCards(7));
  document.querySelector('#fixture-replace-seven').addEventListener('click', () => {
    list.replaceChildren();
    addCards(7);
  });
  document.querySelector('#fixture-complete').addEventListener('click', () => {
    ZLibrary._.downloaded = { byId: { 1: 1 }, byIsbn: {} };
    document.dispatchEvent(new Event('marksLoaded'));
  });
  document.querySelector('#fixture-empty').addEventListener('click', () => {
    ZLibrary._.downloaded = { byId: {}, byIsbn: {} };
    document.dispatchEvent(new Event('marksLoaded'));
  });
</script>
<script src="/booklist-enhancer.user.js"></script>
</html>
